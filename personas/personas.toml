# vegastack-cli — persona registry
#
# A persona is a curated bundle of providers + recipes + tips for a job role.
# Each [[personas]] entry becomes:
#   - skills/personas/<id>/SKILL.md
#   - one row in personas/INDEX.json
#
# Schema:
#   id           kebab-case
#   title        one-line role name ("Platform Engineer")
#   description  1-2 sentences
#   providers    list of providers this role typically touches
#   recipes      list of recipe IDs this role uses (must exist in recipes.toml)
#   keywords     trigger tokens
#   instructions list of prose tips ("always pin provider versions", ...)
#   last_verified, owner — same semantics as recipes
#
# When empty, the generator emits an empty personas/INDEX.json. That's the v0.1
# ground state.

# [[personas]]
# id          = "platform-engineer"
# title       = "Platform Engineer"
# description = "Owns the multi-cloud / multi-provider Terraform monorepo for the org."
# providers   = ["aws", "azure", "gcp", "cloudflare", "datadog"]
# recipes     = ["zero-trust-cloudflare-aws-okta", "scalable-backend-aws-ecs-fargate"]
# keywords    = ["platform", "infra", "ci", "monorepo"]
# instructions = [
#   "Always pin provider versions in required_providers — drift is the #1 source of plan-vs-apply surprises.",
#   "Prefer data sources for shared infra (VPC, DNS zones) over hard-coded IDs."
# ]
# last_verified = "2026-04-27"
# owner         = "engg@vegastack.com"
