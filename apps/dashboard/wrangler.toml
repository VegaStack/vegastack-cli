# Cloudflare Workers deployment for the vegastack-cli eval dashboard.
#
# The Cloudflare adapter auto-generates the [assets] binding from the build
# output. We only declare what the adapter cannot infer: the worker name, custom
# bindings (R2, KV), env vars, and routing.
#
# See https://developers.cloudflare.com/workers/static-assets/binding/

name = "vegastack-evals"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]
main = "./node_modules/@astrojs/cloudflare/dist/entrypoints/server.js"

# R2 binding to the VegaStack Registry bucket. Eval reports live at:
#   cli-registry.vegastack.com/cli/evals/reports/<YYYY-MM-DD>.json
# Reads are cached in KV with a 1h TTL (see src/lib/r2.ts).
[[r2_buckets]]
binding = "REGISTRY"
bucket_name = "vegastack-cli-registry"
preview_bucket_name = "vegastack-cli-registry"

# KV namespace caches R2 fetches and the rolling 30-day report index.
#
# This binding is intentionally OFF in the committed config so a fresh
# checkout (or fork) can `wrangler deploy` without first creating its own
# KV namespace. Cache misses fall through to a direct R2 read — see
# src/lib/r2.ts (the env?.REPORTS_CACHE?.get / .put are optional-chained).
#
# To enable caching for your deployment:
#   1. wrangler kv namespace create REPORTS_CACHE
#   2. wrangler kv namespace create REPORTS_CACHE --preview
#   3. Uncomment the block below and paste the returned IDs.
#
# [[kv_namespaces]]
# binding = "REPORTS_CACHE"
# id = "your-kv-namespace-id-here"
# preview_id = "your-preview-kv-namespace-id-here"

[vars]
PUBLIC_SITE_URL = "https://cli-evals.vegastack.com"
PUBLIC_GITHUB_REPO = "https://github.com/vegastack/vegastack-cli"
PUBLIC_NPM_PACKAGE = "@vegastack/cli"

# Custom domain — uncomment after first successful deploy + DNS setup.
# [[routes]]
# pattern = "cli-evals.vegastack.com/*"
# zone_name = "vegastack.com"

[observability]
enabled = true

[placement]
mode = "smart"
