name: Release (Changesets)

# Opens or updates the "Version Packages" PR for main or develop. Public npm
# publishing is handled by release.yml: develop prerelease tags publish to
# npm dist-tag `next`; main stable tags publish to `latest`.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Open Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
        env:
          VEGASTACK_SKIP_POSTINSTALL: "1"

      - run: npm run build

      - name: Configure git author
        run: |
          git config --global user.name  "vegastack-bot"
          git config --global user.email "bot@vegastack.com"

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@e87c8ed249971350e47fab7515075f44eb134e5b # v1.7.0
        with:
          version: npm run version-sync
          commit: "chore: release versions"
          title: "chore: release versions"
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
