name: Managed Tools Weekly

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/managed-tools-weekly.yml"
      - "scripts/smoke-managed-tools.ts"
      - "scripts/update-managed-tools-manifest.ts"
      - "src/lib/managed-tool-installer.ts"
      - "src/lib/managed-tools.ts"
      - "src/lib/managed-tools-manifest.ts"
      - "src/lib/cloudflared.ts"
      - "src/lib/gitleaks.ts"
      - "src/lib/ripgrep.ts"
      - "src/lib/scan-tools.ts"
  schedule:
    # Mondays 09:15 UTC. The workflow opens a tested release PR only when
    # upstream managed-tool pins changed.
    - cron: "15 9 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: managed-tools-weekly
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh managed tool pins
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        env:
          VEGASTACK_SKIP_POSTINSTALL: "1"

      - name: Discover latest upstream releases and update manifest
        run: npm run managed-tools:update

      - name: Stop when pins did not change
        id: diff
        run: |
          if git diff --quiet -- src/lib/managed-tools-manifest.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add patch changeset
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p .changeset
          cat > ".changeset/managed-tools-$(date +%Y%m%d).md" <<'EOF'
          ---
          "@vegastack/cli": patch
          ---

          Update VegaStack-managed tool pins.
          EOF

      - name: Format
        if: steps.diff.outputs.changed == 'true'
        run: npx prettier --write src/lib/managed-tools-manifest.ts

      - name: Verify
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm run build
          npm test
          npm run managed-tools:smoke

      - name: Create managed-tools update PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/managed-tools-weekly
          delete-branch: true
          title: "chore: update managed tool pins"
          commit-message: "chore: update managed tool pins"
          body: |
            Updates the generated managed tool manifest from upstream GitHub releases.

            Verification run in this workflow:
            - `npm run typecheck`
            - `npm run build`
            - `npm test`
            - `npm run managed-tools:smoke`

            Merging this PR feeds the normal Changesets release flow so the pinned
            tool manifest ships with the next `@vegastack/cli` release.
          labels: dependencies, managed-tools

  smoke:
    name: Smoke managed tools (${{ matrix.os }})
    needs: refresh
    if: always()
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        env:
          VEGASTACK_SKIP_POSTINSTALL: "1"

      - run: npm run build

      - run: npm run managed-tools:smoke
