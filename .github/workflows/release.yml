name: Release

# Publishes @vegastack/cli to npm using OIDC trusted publishing and generates
# SLSA build provenance attestations for the npm package tarball.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish to public npm (e.g. v0.1.11-next.0 or v0.1.11)."
        required: true
        type: string
      npm_tag:
        description: "npm dist-tag. Use next for develop prereleases, latest for main production releases."
        required: true
        default: "next"
        type: choice
        options: ["next", "latest"]

permissions:
  contents: write # GitHub release notes
  id-token: write # OIDC for npm trusted publishing + SLSA attestations
  attestations: write # actions/attest-build-provenance writes attestations

jobs:
  publish-npm:
    name: Publish to npm (OIDC trusted publishing)
    runs-on: ubuntu-latest
    environment: npm-vegastack
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing + Sigstore
      attestations: write # for actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      # setup-node@v6 is the current major as of April 2026 (supports
      # automatic dependency caching from packageManager field).
      - uses: actions/setup-node@v6
        with:
          # npm trusted publishing requires Node 22.14.0+; use current LTS
          # for releases while keeping package engines broad for users.
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm 11+ is required for OIDC trusted publishing without --provenance flag.
      - name: Pin npm to a version that speaks OIDC trusted publishing
        run: npm install -g npm@latest

      - run: npm ci
        env:
          VEGASTACK_SKIP_POSTINSTALL: "1"

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

      - name: Verify version matches tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || (contains(github.ref_name, '-') && 'next' || 'latest') }}
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${TAG#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::version mismatch: package.json=$PKG_VER, tag=$TAG_VER"
            exit 1
          fi
          if [ "$NPM_TAG" = "latest" ] && echo "$PKG_VER" | grep -Eq '-'; then
            echo "::error::refusing to publish prerelease version $PKG_VER under npm tag latest"
            exit 1
          fi
          if [ "$NPM_TAG" = "next" ] && ! echo "$PKG_VER" | grep -Eq '-'; then
            echo "::error::refusing to publish stable version $PKG_VER under npm tag next"
            exit 1
          fi

      - name: Pack tarball (so we can attest it before publish)
        id: pack
        run: |
          npm pack --json > /tmp/pack.json
          TARBALL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/pack.json','utf8'))[0].filename)")
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # SLSA Level 3 build provenance for the npm tarball itself.
      # actions/attest-build-provenance@v2 is the documented stable major
      # for Sigstore-backed in-toto SLSA v1 attestations. (v4 is also
      # available as of April 2026 but is a thin wrapper over actions/attest;
      # v2 is still maintained and is the path the brief explicitly asked for.)
      - name: Attest build provenance (SLSA Level 3)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      # Trusted publishing: no NODE_AUTH_TOKEN, no NPM_TOKEN.
      # npm CLI 11+ detects the GitHub OIDC token via id-token: write
      # and publishes provenance automatically. Package must be configured
      # with a trusted publisher entry on npmjs.com first (one-time setup).
      - name: Publish to npm via OIDC trusted publishing
        env:
          NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.npm_tag || (contains(github.ref_name, '-') && 'next' || 'latest') }}
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken || true
          npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag "$NPM_TAG"

  github-release:
    name: GitHub release notes
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          if [ -f CHANGELOG.md ]; then
            VER="${GITHUB_REF_NAME#v}"
            awk "/^## \\[?${VER//./\\.}\\]?( |$)/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > /tmp/notes.md || true
          fi
          if [ ! -s /tmp/notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > /tmp/notes.md
          fi

      # softprops/action-gh-release pinned to a commit SHA (Dependabot keeps current).
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.4.0
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false
