name: Sync generated skills

# Runs the generated skill/persona renderer and verifies contributors committed
# the deterministic outputs. Registry knowledge content is generated in
# vegastack-cli-registry, not in this repo.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "recipes/**"
      - "personas/**"
      - "scripts/generate-skills.ts"
      - "skills/**"

permissions:
  contents: read

jobs:
  determinism:
    name: Skill regeneration is deterministic (no diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          VEGASTACK_SKIP_POSTINSTALL: "1"
      - run: npm run build

      - name: Regenerate skills
        run: npm run generate-skills

      - name: Fail if the regeneration produced any diff
        run: |
          if ! git diff --quiet -- skills/ recipes/INDEX.json personas/INDEX.json 2>/dev/null; then
            echo "::error::Skill regeneration produced unexpected diffs."
            echo "::error::Run 'npm run generate-skills' locally and commit the changes."
            git diff --stat -- skills/ recipes/INDEX.json personas/INDEX.json || true
            exit 1
          fi
          echo "Skills are deterministic — no diffs."
