name: Policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changeset-required:
    name: Changeset required
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'changeset-release/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether the PR touches user-visible code
        id: scope
        run: |
          # Files whose changes warrant a changeset.
          PATTERNS='^(src/|npm/|skills/|recipes/|knowledge/|concept-aliases/|cursor-rule\.mdc|gemini-extension\.json|CONTEXT\.md|AGENTS\.md|\.claude-plugin/|package\.json)'

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep -E "$PATTERNS" >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify a changeset file is present
        if: ${{ steps.scope.outputs.changed == 'true' }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          # New files under .changeset/ excluding README.md and config.json.
          NEW_CHANGESETS=$(git diff --name-only --diff-filter=A "$BASE_SHA"..."$HEAD_SHA" \
            | grep -E '^\.changeset/[^/]+\.md$' \
            | grep -v '^\.changeset/README\.md$' || true)

          if [ -z "$NEW_CHANGESETS" ]; then
            echo "::error::This PR modifies user-visible code but does not add a .changeset/*.md file."
            echo "Run \`npx changeset\` and commit the generated file."
            echo "If this PR is docs/CI/tests-only and doesn't need a changeset, mention that in the PR description and add the 'no-changeset' label."
            exit 1
          fi

          echo "Found changeset(s):"
          echo "$NEW_CHANGESETS"

  changeset-skipped-for-docs-only:
    name: 'Allow no-changeset for docs/CI/tests-only PRs'
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: |
          echo "If your PR doesn't touch src/ npm/ skills/ recipes/ knowledge/ concept-aliases/, the changeset gate above is skipped automatically."
          echo "If you genuinely need to bypass it for an exceptional case, add the 'no-changeset' label and re-run."
