name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run weekly on Mondays at 06:00 UTC so we catch new CVEs against the same
    # locked deps even if no one has pushed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          VEGASTACK_SKIP_POSTINSTALL: "1"
      - run: npm audit --audit-level=moderate --omit=dev

  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to commit SHA — never trust a floating tag for a security tool.
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        with:
          scan-args: |-
            --recursive
            --skip-git
            --lockfile=package-lock.json
            ./

  # CodeQL is disabled while the repo is private on a Team plan. Code Scanning
  # for private repos requires the Code Security add-on ($30/committer/month)
  # or GHAS ($49/committer/month). Re-enable when the repo goes public (then
  # it's free) or when the org buys the add-on.
